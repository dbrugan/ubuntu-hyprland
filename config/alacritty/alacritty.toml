# Alacritty configuration, installed to ~/.config/alacritty/alacritty.toml.
# Colors follow the current Ubuntu theme where possible; run `ub restart
# alacritty` after switching themes to pick up changes.

[general]
import = []

[window]
decorations = false
padding = {
  x = 8
  y = 6
}
dynamic_padding = true
dynamic_title = true

[scrolling]
history = 10000

[fonts]
size = 11.0
normal = { family = "JetBrains Mono Nerd Font", style = "Regular" }
bold = { family = "JetBrains Mono Nerd Font", style = "Bold" }
italic = { family = "JetBrains Mono Nerd Font", style = "Italic" }

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500

[selection]
save_to_clipboard = true

[shell]
program = "/usr/bin/bash"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
chars = "\u000e"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
chars = "\u0003"

[[keyboard.bindings]]
key = "Left"
mods = "Shift"
chars = "\u001b[b"

[[keyboard.bindings]]
key = "Right"
mods = "Shift"
chars = "\u001b[f"
