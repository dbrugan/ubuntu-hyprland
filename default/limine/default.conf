# Kernel command line and UKI settings for limine-snapper-sync.
#
# install/login/limine-snapper.sh copies this to /etc/default/limine (which the
# sync tool reads in preference to /etc/limine-snapper-sync.conf) after
# substituting @@CMDLINE@@ with the cmdline found in the existing limine.conf.
#
# Anything appended from /etc/limine-entry-tool.d/*.conf lands here too, which is
# where hardware fix scripts and hibernation drop-ins would hook in.

TARGET_OS_NAME="Ubuntu"

ESP_PATH="/boot"

KERNEL_CMDLINE[default]+="@@CMDLINE@@"
KERNEL_CMDLINE[default]+=" quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0"

ENABLE_UKI=yes
CUSTOM_UKI_NAME="ubuntu"

ENABLE_LIMINE_FALLBACK=yes

# Find and add other bootloaders
FIND_BOOTLOADERS=yes

BOOT_ORDER="*, *fallback, Snapshots"

MAX_SNAPSHOT_ENTRIES=5

SNAPSHOT_FORMAT_CHOICE=5