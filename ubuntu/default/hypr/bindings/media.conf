# Laptop multimedia keys for volume and LCD brightness (with OSD)
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, ub-audio-output-volume raise
bindeld = ,XF86AudioLowerVolume, Volume down, exec, ub-audio-output-volume lower
bindeld = ,XF86AudioMute, Mute, exec, ub-audio-output-volume mute-toggle
bindeld = ,XF86AudioMicMute, Mute microphone, exec, ub-audio-input-mute
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, ub-brightness-display +5%
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, ub-brightness-display 5%-
bindeld = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, ub-brightness-display 100%
bindeld = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, ub-brightness-display 1%
bindeld = ,XF86KbdBrightnessUp, Keyboard brightness up, exec, ub-brightness-keyboard up
bindeld = ,XF86KbdBrightnessDown, Keyboard brightness down, exec, ub-brightness-keyboard down
bindld = ,XF86KbdLightOnOff, Keyboard backlight cycle, exec, ub-brightness-keyboard cycle
bindld = ,XF86TouchpadToggle, Toggle touchpad, exec, ub-toggle-touchpad
bindld = ,XF86TouchpadOn, Enable touchpad, exec, ub-toggle-touchpad on
bindld = ,XF86TouchpadOff, Disable touchpad, exec, ub-toggle-touchpad off

# Precise 1% multimedia adjustments with Alt modifier
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, ub-audio-output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, ub-audio-output-volume -1
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, ub-brightness-display +1%
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, ub-brightness-display 1%-

# Player control goes through the shell's media service, which
# also raises the OSD when the player state changes.
bindld = , XF86AudioNext, Next track, exec, ub-shell media next
bindld = , XF86AudioPause, Pause, exec, ub-shell media playPause
bindld = , XF86AudioPlay, Play, exec, ub-shell media playPause
bindld = , XF86AudioPrev, Previous track, exec, ub-shell media previous

# Switch audio output with Super + Mute
bindld = SUPER, XF86AudioMute, Switch audio output, exec, ub-audio-output-switch
