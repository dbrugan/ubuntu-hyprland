# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(ub-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(ub-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, ub-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(ub-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, ub-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, ub-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, ub-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, ub-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, ub-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, ub-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, ub-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, ub-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# Web app bindings are omitted: this setup intentionally ships no webapps,
# and ub-launch-webapp / ub-launch-or-focus-webapp are not ported.

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

