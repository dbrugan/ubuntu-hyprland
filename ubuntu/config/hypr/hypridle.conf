general {
    lock_cmd = ub-system-lock                         # lock screen
    before_sleep_cmd = ub-system-lock                 # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && ub-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 2.5 minutes
listener {
    timeout = 150
    on-timeout = ub-hyprland-session-locked || ub-launch-screensaver
}

# Lock system after 5 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 152
    on-timeout = ub-system-lock
    on-resume = ub-system-wake
}
