# tmux configuration, installed to ~/.config/tmux/tmux.conf.

set -g default-terminal "tmux-256color"
set -g default-shell /usr/bin/bash
set -ga terminal-overrides ",xterm-256color:Tc"

set -g history-limit 50000
set -g mouse on
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits inherit the current working directory
bind-key - new-window -c '#{pane_current_path}'
bind-key | split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'

# Reload the config without restarting
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Vim-ish pane movement
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Move the pane start of line
bind-key -n H send-keys Home
bind-key -n J send-keys -X clear-history